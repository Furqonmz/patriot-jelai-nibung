<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Transmigrasi Jelai-Nibung</title>
    <link rel="stylesheet" href="css/style.css"> <!-- Sesuaikan dengan CSS kamu -->
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        .login-card h2 { margin-bottom: 20px; text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-login { width: 100%; background: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-login:hover { background: #0056b3; }
        .error-msg { color: red; font-size: 12px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login Admin</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-login">Masuk</button>
            <p id="errorMsg" class="error-msg"></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Jika login sukses, simpan status admin ke localStorage browser
                    localStorage.setItem("isAdmin", "true");
                    alert("Login Berhasil!");
                    window.location.href = "index.html"; // Kembali ke halaman utama
                } else {
                    errorMsg.textContent = result.pesan || "Login gagal!";
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Terjadi kesalahan pada server.";
            }
        });
    </script>
</body>
</html>
